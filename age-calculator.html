<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N5FS3X06BP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N5FS3X06BP');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator Online - Exact Age in Years, Months, Days | QuickResizer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">
            <i class="fa-solid fa-expand logo-icon"></i>
            <span>QuickResizer</span>
        </div>
    </header>

    <main class="hero-section">
        <h1 class="main-title">Online Age Calculator</h1>
        <p class="sub-title">Calculate exact age in years, months, and days for government exams & forms.</p>

        <div style="max-width:500px; margin:20px auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); text-align:left;">
            <label><b>Select Date of Birth (DOB):</b></label>
            <input type="date" id="dob" style="width:100%; padding:10px; margin:10px 0 20px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;">

            <button onclick="calculateAge()" style="width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:16px;">
                Calculate Age
            </button>

            <div id="ageResult" style="margin-top:20px; text-align:center; font-size:18px; color:#1e293b;"></div>
        </div>
    </main>

    <script>
        function calculateAge() {
            // 🔒 1. PRO & Free Usage Limit Check
            let user = JSON.parse(localStorage.getItem('quickresizer_user')) || null;
            let usageCounters = JSON.parse(localStorage.getItem('qr_free_usage')) || { age: 0, date: new Date().toDateString() };

            if (usageCounters.date !== new Date().toDateString()) {
                usageCounters = { age: 0, date: new Date().toDateString() };
            }

            if ((!user || !user.isPro) && usageCounters.age >= 3) {
                alert("🔒 Daily Limit Reached: फ्री यूज़र्स दिन में सिर्फ 3 बार एज कैलकुलेट कर सकते हैं। अनलिमिटेड एक्सेस के लिए प्रो प्लान लें!");
                window.location.href = "index.html#pricing";
                return;
            }

            // 2. Calculation Logic
            let dobInput = document.getElementById('dob') || document.getElementById('birthDate');
            if(!dobInput || !dobInput.value) { 
                alert("Please select Date of Birth!"); 
                return; 
            }

            let dob = new Date(dobInput.value);
            let today = new Date();
            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();
            let days = today.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            // Update usage count for free users
            if (!user || !user.isPro) {
                usageCounters.age++;
                localStorage.setItem('qr_free_usage', JSON.stringify(usageCounters));
            }

            let resBox = document.getElementById('ageResult') || document.getElementById('result');
            if(resBox) resBox.innerHTML = `Your Age is: <b>${years} Years, ${months} Months, ${days} Days</b>`;
        }
    </script>
</body>
</html>
