<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N5FS3X06BP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N5FS3X06BP');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No-Crop Square Post Maker with Blur Background | QuickResizer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar"><div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;"><i class="fa-solid fa-expand logo-icon"></i><span>QuickResizer</span></div></header>
    <main class="hero-section">
        <h1 class="main-title">No-Crop Square Post Maker</h1>
        <p class="sub-title">Fit full-size photos on Instagram or WhatsApp DP without cropping by adding blurry background</p>
        <div style="max-width:500px; margin:20px auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); text-align:left;">
            <input type="file" id="nocropImg" accept="image/*" style="margin-bottom:15px;">
            <button onclick="processNoCrop()" style="width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Generate Square Post</button>
            <div id="previewArea" style="margin-top:20px; text-align:center;">
                <canvas id="canvas" style="max-width:100%; border-radius:8px; display:none;"></canvas>
            </div>
        </div>
    </main>
    <script>
        function processNoCrop() {
            let file = document.getElementById('nocropImg').files[0];
            if(!file) { alert("Select Image!"); return; }
            let reader = new FileReader();
            reader.onload = function(e) {
                let img = new Image();
                img.onload = function() {
                    let cvs = document.getElementById('canvas');
                    let ctx = cvs.getContext('2d');
                    let sz = Math.max(img.width, img.height);
                    cvs.width = sz; cvs.height = sz;
                    ctx.filter = "blur(20px)";
                    ctx.drawImage(img, 0, 0, sz, sz);
                    ctx.filter = "none";
                    let x = (sz - img.width)/2;
                    let y = (sz - img.height)/2;
                    ctx.drawImage(img, x, y);
                    cvs.style.display = "block";
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
