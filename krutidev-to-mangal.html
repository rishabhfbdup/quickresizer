    <script>
        function checkLength() {
            let input = document.getElementById('krutiText').value;
            let badge = document.getElementById('charLimitMsg');
            badge.innerText = `Characters: ${input.length} / 1000 (Free Limit)`;
            
            if (input.length > 1000) {
                badge.style.color = '#ef4444';
            } else {
                badge.style.color = '#64748b';
            }
        }

                return;

            if (!isProUser && src.length > 1000) {

                return;
            }

                usageCounters = { fontConvert: 0, date: new Date().toDateString() };
            }

                window.location.href = "index.html#pricing";
                return;
            }

            // Engine Processing
            let kArray = ["k","s","Tk","Rk","~","`","!","@","#","$","%","^","&","*","(",")","-","_","=","+"];
            let mArray = ["ा","्","का","क्का","़","़","।","्","्र","्य","्र","्","्र","्","्र","्","न्","न्","म्","म्"];
            let res = src;
            for(let i=0; i<kArray.length; i++){
                res = res.split(kArray[i]).join(mArray[i]);
            }
            
            document.getElementById('mangalText').value = res;

            // Increment count for free users
            if (!isProUser) {
                usageCounters.fontConvert++;
                localStorage.setItem('qr_free_usage', JSON.stringify(usageCounters));
            }
        }
