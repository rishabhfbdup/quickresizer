<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N5FS3X06BP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N5FS3X06BP');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Minifier Online - Compress Code Speed | QuickResizer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar"><div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;"><i class="fa-solid fa-expand logo-icon"></i><span>QuickResizer</span></div></header>
    <main class="hero-section">
        <h1 class="main-title">HTML & CSS Minifier</h1>
        <p class="sub-title">Compress HTML and CSS code by removing spaces & line breaks to boost website speed.</p>
        <div style="max-width:700px; margin:20px auto; text-align:left;">
            <textarea id="codeIn" rows="6" placeholder="Paste raw HTML/CSS code here..." style="width:100%; padding:15px; border-radius:8px; border:1px solid #ccc; font-family:monospace;"></textarea>
            <button onclick="document.getElementById('codeOut').value = document.getElementById('codeIn').value.replace(/\s+/g, ' ').trim();" style="width:100%; padding:12px; margin-top:10px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Minify Code</button>
            <textarea id="codeOut" rows="6" readonly placeholder="Minified code result..." style="width:100%; margin-top:15px; padding:15px; border-radius:8px; border:1px solid #ccc; background:#f8fafc; font-family:monospace;"></textarea>
        </div>
    </main>
</body>
