<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N5FS3X06BP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N5FS3X06BP');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator Online - Calculate Sale Price & Savings | QuickResizer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar"><div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;"><i class="fa-solid fa-expand logo-icon"></i><span>QuickResizer</span></div></header>
    <main class="hero-section">
        <h1 class="main-title">Discount & Sale Calculator</h1>
        <p class="sub-title">Calculate final reduced price and exact money saved during shopping sales</p>
        <div style="max-width:500px; margin:20px auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); text-align:left;">
            <label><b>Original Price (₹):</b></label>
            <input type="number" id="origPrice" placeholder="e.g. 2499" style="width:100%; padding:10px; margin:5px 0 15px; border:1px solid #ccc; border-radius:6px;">
            
            <label><b>Discount (% off):</b></label>
            <input type="number" id="discPct" placeholder="e.g. 20" style="width:100%; padding:10px; margin:5px 0 20px; border:1px solid #ccc; border-radius:6px;">
            
            <button onclick="calcDisc()" style="width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Calculate Final Price</button>
            
            <div id="discRes" style="margin-top:20px; text-align:center;"></div>
        </div>
    </main>
    <script>
        function calcDisc() {
            let P = parseFloat(document.getElementById('origPrice').value);
            let D = parseFloat(document.getElementById('discPct').value);
            if(!P || isNaN(D)) { alert("Fill all fields!"); return; }
            
            let save = (P * D) / 100;
            let finalPrice = P - save;

            document.getElementById('discRes').innerHTML = `
                <div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0;">
                    <p style="margin:5px 0;">You Save: <b style="color:#10b981;">₹${save.toFixed(2)}</b></p>
                    <p style="margin:5px 0; font-size:18px;">Discounted Price: <b style="color:#2563eb;">₹${finalPrice.toFixed(2)}</b></p>
                </div>
            `;
        }
    </script>
</body>
</html>
