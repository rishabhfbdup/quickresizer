<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N5FS3X06BP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N5FS3X06BP');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator Online - 100% Client-Side | QuickResizer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">
            <i class="fa-solid fa-expand logo-icon"></i>
            <span>QuickResizer</span>
        </div>
    </header>

    <main class="hero-section">
        <h1 class="main-title">Secure Password Generator</h1>
        <p class="sub-title">Generate strong, random passwords 100% locally in your browser. Zero server uploads.</p>
        
        <div style="max-width:500px; margin:20px auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); text-align:left;">
            
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label><b>Password Length:</b> <span id="lenVal">16</span></label>
                <span id="lengthBadge" style="font-size:11px; font-weight:bold; color:#10b981;">Standard Free Limit (Max 16)</span>
            </div>
            
            <input type="range" id="passLen" min="8" max="32" value="16" style="width:100%; margin:10px 0;" oninput="checkLengthAndDisplay(this.value)">
            
            <div style="margin:10px 0;">
                <input type="checkbox" id="incNums" checked> <label for="incNums">Include Numbers (0-9)</label><br>
                <input type="checkbox" id="incSyms" checked> <label for="incSyms">Include Symbols (@#$%)</label>
            </div>

            <button onclick="genPass()" style="width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:10px; font-size:16px;">
                <i class="fa-solid fa-key"></i> Generate Strong Password
            </button>
            
            <div style="margin-top:20px; display:flex; gap:10px;">
                <input type="text" id="passOut" readonly style="width:80%; padding:10px; border-radius:6px; border:1px solid #ccc; font-weight:bold; color:#1e293b; box-sizing:border-box; font-family:monospace; font-size:16px;">
                <button onclick="copyPassword()" style="width:20%; padding:10px; background:#10b981; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Copy</button>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // शुरुआती रैंडम पासवर्ड जेनरेट करें बिना काउंट बढ़ाए
            executeGeneration();
        });

        function checkLengthAndDisplay(val) {
            document.getElementById('lenVal').innerText = val;
            let badge = document.getElementById('lengthBadge');
            
            if (parseInt(val) > 16) {
                badge.innerText = "🔒 PRO SUBSCRIPTION REQUIRED";
                badge.style.color = "#ef4444";
            } else {
                badge.innerText = "Standard Free Limit (Max 16)";
                badge.style.color = "#10b981";
            }
        }

        function executeGeneration() {
            let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if(document.getElementById('incNums').checked) chars += "0123456789";
            if(document.getElementById('incSyms').checked) chars += "!@#$%^&*()_+-=[]{}|;:,.<>?";
            let len = parseInt(document.getElementById('passLen').value);
            let pass = "";
            for(let i=0; i<len; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('passOut').value = pass;
        }

        function genPass() {
            let user = JSON.parse(localStorage.getItem('quickresizer_user')) || null;
            let isProUser = user && user.isPro;
            let currentLen = parseInt(document.getElementById('passLen').value);

            // 1. 🔒 LENGTH LOCK GATE (More than 16 characters requires PRO)
            if (!isProUser && currentLen > 16) {
                alert("🔒 PRO LOCK: 16 कैरेक्टर्स से अधिक लंबे और सुरक्षित पासवर्ड्स जनरेट करना केवल प्रीमियम सब्सक्रिप्शन में उपलब्ध है। कृपया अपग्रेड करें!");
                window.location.href = "index.html#pricing";
                return;
            }

            // 2. 🔒 DAILY 3 GENERATION LIMIT CHECK
            let usageCounters = JSON.parse(localStorage.getItem('qr_free_usage')) || { passGen: 0, date: new Date().toDateString() };

            if (usageCounters.date !== new Date().toDateString()) {
                usageCounters = { passGen: 0, date: new Date().toDateString() };
            }

            if (!isProUser && usageCounters.passGen >= 3) {
                alert("🔒 Limit Reached: आपके आज के 3 मुफ़्त पासवर्ड जनरेटर चांस समाप्त हो चुके हैं! अनलिमिटेड और एक्स्ट्रा लॉन्ग पासवर्ड्स के लिए प्रो प्लान लें।");
                window.location.href = "index.html#pricing";
                return;
            }

            // Execute code
            executeGeneration();

            // Increment count for free users
            if (!isProUser) {
                usageCounters.passGen++;
                localStorage.setItem('qr_free_usage', JSON.stringify(usageCounters));
            }
        }

        function copyPassword() {
            let out = document.getElementById('passOut').value;
            if(!out) {
                alert("Please generate a password first!");
                return;
            }
            navigator.clipboard.writeText(out);
            alert('📋 Password copied to clipboard successfully!');
        }
    </script>
</body>
</html>
