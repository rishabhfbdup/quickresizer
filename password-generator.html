<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N5FS3X06BP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N5FS3X06BP');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator Online - 100% Client-Side | QuickResizer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar"><div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;"><i class="fa-solid fa-expand logo-icon"></i><span>QuickResizer</span></div></header>
    <main class="hero-section">
        <h1 class="main-title">Secure Password Generator</h1>
        <p class="sub-title">Generate strong, random passwords 100% locally in your browser. Zero server uploads.</p>
        <div style="max-width:500px; margin:20px auto; background:#fff; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); text-align:left;">
            <label><b>Password Length:</b> <span id="lenVal">16</span></label>
            <input type="range" id="passLen" min="8" max="32" value="16" style="width:100%; margin:10px 0;" oninput="document.getElementById('lenVal').innerText=this.value">
            
            <div style="margin:10px 0;">
                <input type="checkbox" id="incNums" checked> <label for="incNums">Include Numbers (0-9)</label><br>
                <input type="checkbox" id="incSyms" checked> <label for="incSyms">Include Symbols (@#$%)</label>
            </div>

            <button onclick="genPass()" style="width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:10px;">Generate Strong Password</button>
            
            <div style="margin-top:20px; display:flex; gap:10px;">
                <input type="text" id="passOut" readonly style="width:80%; padding:10px; border-radius:6px; border:1px solid #ccc; font-weight:bold; color:#1e293b;">
                <button onclick="navigator.clipboard.writeText(document.getElementById('passOut').value); alert('Copied!');" style="width:20%; padding:10px; background:#10b981; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Copy</button>
            </div>
        </div>
    </main>
    <script>
        function genPass() {
            let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if(document.getElementById('incNums').checked) chars += "0123456789";
            if(document.getElementById('incSyms').checked) chars += "!@#$%^&*()_+-=[]{}|;:,.<>?";
            let len = parseInt(document.getElementById('passLen').value);
            let pass = "";
            for(let i=0; i<len; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('passOut').value = pass;
        }
        genPass();
    </script>
</body>
</html>
