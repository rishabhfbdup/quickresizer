<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N5FS3X06BP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N5FS3X06BP');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Handwriting Converter Online - Free Assignment Generator | QuickResizer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar"><div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;"><i class="fa-solid fa-expand logo-icon"></i><span>QuickResizer</span></div></header>
    <main class="hero-section">
        <h1 class="main-title">Text to Handwriting Converter</h1>
        <p class="sub-title">Convert typed text into realistic handwritten notebook pages for assignments</p>
        <div style="max-width:700px; margin:20px auto; text-align:left;">
            <textarea id="inputText" rows="5" placeholder="Type or paste your text here..." style="width:100%; padding:15px; border-radius:8px; border:1px solid #ccc;"></textarea>
            <button onclick="generateHandwriting()" style="width:100%; padding:12px; margin-top:10px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Generate Handwritten Image</button>
            
            <div id="paper" style="display:none; margin-top:20px; padding:30px; background:#fff; background-image: repeating-linear-gradient(white, white 29px, #93c5fd 30px); font-family: 'Caveat', cursive; font-size:24px; line-height:30px; color:#1e3a8a; border-left:2px solid #ef4444; box-shadow:0 4px 15px rgba(0,0,0,0.1); border-radius:6px; min-height:300px; white-space:pre-wrap;"></div>
        </div>
    </main>
    <script>
        function generateHandwriting() {
            let txt = document.getElementById('inputText').value;
            if(!txt) { alert("Please enter some text!"); return; }
            let paper = document.getElementById('paper');
            paper.style.display = "block";
            paper.innerText = txt;
        }
    </script>
</body>
</html>
